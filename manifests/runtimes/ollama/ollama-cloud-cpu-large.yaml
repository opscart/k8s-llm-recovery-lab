apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: llm-recovery-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: ollama
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:latest
          ports:
            - containerPort: 11434
          resources:
            requests:
              cpu: "4"
              memory: 8Gi
            limits:
              cpu: "8"
              memory: 16Gi
          volumeMounts:
            - name: ollama-data
              mountPath: /root/.ollama
      volumes:
        - name: ollama-data
          persistentVolumeClaim:
            claimName: ollama-models-large
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: llm-recovery-lab
spec:
  selector:
    app: ollama
  ports:
    - port: 11434
      targetPort: 11434
