apiVersion: v1
kind: PersistentVolume
metadata:
  name: qwen25-coder-model-cache-gpu
spec:
  capacity:
    storage: 100Gi
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem
  persistentVolumeReclaimPolicy: Retain
  storageClassName: qwen25-coder-gpu-local
  local:
    path: /var/lib/llm-recovery/ollama
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: llm-recovery-role
              operator: In
              values:
                - gpu
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qwen25-coder-model-cache-gpu
  namespace: llm-recovery-lab
spec:
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem
  storageClassName: qwen25-coder-gpu-local
  volumeName: qwen25-coder-model-cache-gpu
  resources:
    requests:
      storage: 100Gi
