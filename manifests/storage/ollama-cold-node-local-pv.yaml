apiVersion: v1
kind: PersistentVolume
metadata:
  name: ollama-models-node-a
  labels:
    llm-recovery-node: source
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ollama-node-local
  local:
    path: /var/lib/llm-recovery/ollama
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: llm-recovery-role
              operator: In
              values:
                - source
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: ollama-models-node-b
  labels:
    llm-recovery-node: target
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ollama-node-local
  local:
    path: /var/lib/llm-recovery/ollama
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: llm-recovery-role
              operator: In
              values:
                - target
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-models-source
  namespace: llm-recovery-lab
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ollama-node-local
  volumeName: ollama-models-node-a
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-models-target
  namespace: llm-recovery-lab
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ollama-node-local
  volumeName: ollama-models-node-b
  resources:
    requests:
      storage: 10Gi
