apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: llm-recovery-lab
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: ollama
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: ollama
    spec:
      containers:
      - image: ollama/ollama:latest
        imagePullPolicy: Always
        name: ollama
        ports:
        - containerPort: 11434
          protocol: TCP
        readinessProbe:
          failureThreshold: 1
          httpGet:
            path: /ready
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 1
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 120
        resources:
          limits:
            cpu: '2'
            memory: 4Gi
          requests:
            cpu: 500m
            memory: 1Gi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /root/.ollama
          name: ollama-data
      - command:
        - sh
        - -c
        - "cat > /tmp/readiness.py <<'PY'\nimport json\nimport urllib.request\nfrom\
          \ http.server import BaseHTTPRequestHandler, HTTPServer\n\nMODEL = \"llama3.2:3b\"\
          \n\nclass Handler(BaseHTTPRequestHandler):\n    def do_GET(self):\n    \
          \    if self.path != \"/ready\":\n            self.send_response(404)\n\
          \            self.end_headers()\n            return\n\n        try:\n  \
          \          payload = json.dumps({\n                \"model\": MODEL,\n \
          \               \"prompt\": \"READY\",\n                \"stream\": False,\n\
          \                \"options\": {\n                    \"num_predict\": 1,\n\
          \                    \"temperature\": 0\n                }\n           \
          \ }).encode()\n\n            req = urllib.request.Request(\n           \
          \     \"http://127.0.0.1:11434/api/generate\",\n                data=payload,\n\
          \                headers={\"Content-Type\": \"application/json\"}\n    \
          \        )\n\n            with urllib.request.urlopen(req, timeout=120)\
          \ as response:\n                body = json.loads(response.read())\n\n \
          \           if body.get(\"done\") is True:\n                self.send_response(200)\n\
          \            else:\n                self.send_response(503)\n\n        except\
          \ Exception as exc:\n            print(f\"readiness check failed: {exc}\"\
          , flush=True)\n            self.send_response(503)\n\n        self.end_headers()\n\
          \n    def log_message(self, fmt, *args):\n        print(fmt % args, flush=True)\n\
          \nHTTPServer((\"0.0.0.0\", 8080), Handler).serve_forever()\nPY\npython3\
          \ /tmp/readiness.py"
        image: python:3.12-alpine
        imagePullPolicy: IfNotPresent
        name: readiness-helper
        ports:
        - containerPort: 8080
          protocol: TCP
        resources:
          limits:
            cpu: 100m
            memory: 64Mi
          requests:
            cpu: 10m
            memory: 32Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
      - name: ollama-data
        persistentVolumeClaim:
          claimName: ollama-models
